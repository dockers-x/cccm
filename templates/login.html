            --font-claude-response: var(--font-tiempos),var(--font-fallback-serif);

        body {
            background: hsl(var(--bg-000));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: hsl(var(--text-000));
            font-family: var(--font-ui);
            transition: all 0.3s ease;
        }
        
        .login-container {
            background: hsl(var(--bg-100));
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px hsl(var(--bg-300) / 0.1);
            max-width: 400px;
            width: 100%;
            animation: slideIn 0.6s ease-out;
            position: relative;
            border: 1px solid hsl(var(--bg-200));
        }
        
        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .theme-toggle:hover {
            background: hsl(var(--accent-brand) / 0.1);
            transform: scale(1.1);
        }
        
        .theme-toggle svg {
            width: 24px;
            height: 24px;
            fill: hsl(var(--text-000));
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .logo {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        
        .login-button {
            background: hsl(var(--accent-brand)) !important;
            border: none !important;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            color: hsl(var(--oncolor-100)) !important;
            padding: 0.75rem 1.5rem !important;
            border-radius: 10px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            font-size: 1rem !important;
            font-family: var(--font-ui) !important;
        }
        
        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px hsl(var(--bg-300) / 0.2);
            background: hsl(var(--accent-main-100)) !important;
        }
        
        .login-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .login-button:hover::before {
            left: 100%;
        }
        
        .error {
            background: #ff4757;
            color: white;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        input[type="password"], select {
            border-radius: 10px;
            border: 2px solid hsl(var(--bg-300));
            transition: all 0.3s ease;
            background: hsl(var(--bg-100));
            color: hsl(var(--text-000));
            font-family: var(--font-ui);
            padding: 0.75rem;
            font-size: 1rem;
            box-shadow: 0 2px 8px hsl(var(--bg-400) / 0.1);
        }
        
        input[type="password"]:focus, select:focus {
            border-color: hsl(var(--accent-brand));
            box-shadow: 0 0 0 3px hsl(var(--accent-brand) / 0.1);
            outline: none;
        }
        
        .claude-response h1 {
            font-family: var(--font-claude-response);
            font-size: 1.75rem;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.02em
        }

        .claude-response h2 {
            font-family: var(--font-claude-response);
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.4;
            letter-spacing: -0.01em
        }

            font-family: var(--font-claude-response);
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.35;

        .claude-response p {

        }

            font-family: var(--font-claude-response);
            font-size: 1rem;
            line-height: 1.5;
            letter-spacing: -0.005em
        }

        }

        .claude-response small {
            font-weight: 400
        }

            font-family: var(--font-claude-response);
            font-size: 0.875rem;
            line-height: 1.5;
            letter-spacing: -0.005em
        }

        .claude-response p small b {
            font-weight: 600
        }

        .claude-response code {
            font-size: 0.813rem
        }

        .claude-response code, .claude-response code small {
            font-family: var(--font-mono);
            font-weight: 400;
            line-height: 1.5
        }

        .claude-response code small {
            font-size: 0.688rem
        }

        .hljs {
            display: block;
            overflow-x: auto;
            padding: 0.5em;
            color: #abb2bf;
            background: #282c34
        }

        .hljs-comment, .hljs-quote {
            color: #5c6370;
            font-style: italic
        }

        .hljs-doctag, .hljs-formula, .hljs-keyword {
            color: #c678dd
        }

        .hljs-deletion, .hljs-name, .hljs-section, .hljs-selector-tag, .hljs-subst {
            color: #e06c75
        }

        .hljs-literal {
            color: #56b6c2
        }

        .hljs-addition, .hljs-attribute, .hljs-meta-string, .hljs-regexp, .hljs-string {
            color: #98c379
        }

        .hljs-built_in, .hljs-class .hljs-title {
            color: #e6c07b
        }

        .hljs-attr, .hljs-number, .hljs-selector-attr, .hljs-selector-class, .hljs-selector-pseudo, .hljs-template-variable, .hljs-type, .hljs-variable {
            color: #d19a66
        }

        .hljs-bullet, .hljs-link, .hljs-meta, .hljs-selector-id, .hljs-symbol, .hljs-title {

        }

        .hljs-emphasis {

        }

        }

            color: hsl(var(--text-000));
        }

        }
        
        h1 {
            color: hsl(var(--text-000));
            font-family: var(--font-claude-response);

            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.02em;
        }
        
        label {
            color: hsl(var(--text-000));
            font-family: var(--font-ui);
        }

        {% if let Some(error) = error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="post" action="/login">
            <div class="grid">
                <label for="password">
                    {{ i18n.t("password") }}
                    <input type="password" id="password" name="password" placeholder="{{ i18n.t("enter_admin_password") }}" required>
                </label>
            </div>
            <button type="submit" class="login-button">{{ i18n.t("login") }}</button>
        </form>
    </div>
    
    <script>
        // Theme management
        function toggleTheme() {
            const body = document.body;
            const currentMode = body.getAttribute('data-mode');
            const newMode = currentMode === 'light' ? 'dark' : 'light';
            
            body.setAttribute('data-mode', newMode);
            localStorage.setItem('theme', newMode);
            
            // Toggle icons
            const lightIcon = document.getElementById('light-icon');
            const darkIcon = document.getElementById('dark-icon');
            
            if (newMode === 'dark') {
                lightIcon.style.display = 'none';
                darkIcon.style.display = 'block';
            } else {
                lightIcon.style.display = 'block';
                darkIcon.style.display = 'none';
            }
        }
        
        // Language switching
        function changeLanguage() {
            const selector = document.getElementById('language-selector');
            const newLang = selector.value;
            localStorage.setItem('language', newLang);
            
            // Reload page with language parameter
            const url = new URL(window.location);
            url.searchParams.set('lang', newLang);
            window.location.href = url.toString();
        }
        
        // Initialize theme from localStorage
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.body.setAttribute('data-mode', savedTheme);
            
            const lightIcon = document.getElementById('light-icon');
            const darkIcon = document.getElementById('dark-icon');
            
            if (savedTheme === 'dark') {
                lightIcon.style.display = 'none';
                darkIcon.style.display = 'block';
            } else {
                lightIcon.style.display = 'block';
                darkIcon.style.display = 'none';
            }
            
            // Initialize language from URL parameters or localStorage
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            const savedLang = localStorage.getItem('language') || 'en';
            
            // Use URL parameter if available, otherwise use saved language
            const currentLang = urlLang || savedLang;
            document.getElementById('language-selector').value = currentLang;
            
            // If URL doesn't have lang parameter but we have a saved language, update URL
            if (!urlLang && savedLang !== 'en') {
                const url = new URL(window.location);
                url.searchParams.set('lang', savedLang);
                window.history.replaceState({}, '', url);
            }
        });
    </script>
